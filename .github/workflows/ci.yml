name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests du serveur (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests
        run: ./mvnw -B test
